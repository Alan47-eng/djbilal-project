services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: djbilal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: djbilal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql+asyncpg://djbilal:password@postgres:5432/djbilal_db"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4173}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-gbilal1717@gmail.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me-in-production}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      FROM_EMAIL: "${FROM_EMAIL:-onboarding@resend.dev}"
      LEMON_SQUEEZY_API_KEY: "${LEMON_SQUEEZY_API_KEY:-}"
      LEMON_SQUEEZY_STORE_ID: "${LEMON_SQUEEZY_STORE_ID:-}"
      LEMON_SQUEEZY_WEBHOOK_SECRET: "${LEMON_SQUEEZY_WEBHOOK_SECRET:-}"
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:4173"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
      PORT: "4173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
