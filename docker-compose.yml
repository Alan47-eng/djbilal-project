services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: djbilal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: djbilal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql+asyncpg://djbilal:password@postgres:5432/djbilal_db"
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    # Mount source but keep installed node_modules from the image
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
