services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: djbilal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: djbilal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql+asyncpg://djbilal:password@postgres:5432/djbilal_db"
      FRONTEND_ORIGINS: "http://localhost:3000"
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:4173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
