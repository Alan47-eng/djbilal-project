services:
  - type: web
    name: djbilal-backend
    env: docker
    rootDir: backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: djbilal-frontend
    env: docker
    rootDir: frontend
    plan: starter
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
