services:
  - type: web
    name: djbilal-backend
    env: docker
    rootDir: backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: djbilal-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://djbilal-frontend.onrender.com
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: djbilal-frontend
    env: docker
    rootDir: frontend
    plan: starter
    envVars:
      - key: VITE_API_BASE_URL
        value: https://djbilal-backend.onrender.com

databases:
  - name: djbilal-db
    plan: starter
